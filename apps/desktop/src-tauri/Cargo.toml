[package]
name = "cavecad-desktop"
version = "0.0.1"
edition = "2024"
publish = false
description = "CaveCAD desktop app: the web app in a native window, with real folder paths and Reveal in Finder."

# Not part of the engine's workspace: the engine builds for the browser too, and this crate (a native
# window) must never be asked to.
[workspace]

[lib]
name = "cavecad_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Test builds only (desktop.yml channel=dev): the localhost debug bridge (src/bridge.rs). Never in a regular release.
debug-bridge = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
cave-folder = { path = "../../../crates/cave-folder" }
# CaveCAD Capture on the same iPhone/iPad (src/capture.rs): shot files, placing, shared stations.
cave-capture = { path = "../../../crates/cave-capture" }
cave-survey = { path = "../../../crates/cave-survey" }
memmap2 = "0.9"
tauri-plugin-capture-link = { path = "plugins/tauri-plugin-capture-link" }
# Bluetooth for surveying instruments (src/ble.rs): the app's web view has no Web Bluetooth.
btleplug = "0.11"
futures = "0.3"
tokio = { version = "1", features = ["time", "sync"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Desktop only: the iPad build (tauri ios) installs through Xcode or the App Store, and is one app per device.
[target."cfg(any(target_os = \"macos\", windows, target_os = \"linux\"))".dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2"

[target."cfg(target_os = \"macos\")".dependencies]
objc2 = "0.6"

# btleplug with one CaveCAD patch (vendor/btleplug-0.11.8/src/corebluetooth/internal.rs, start_discovery): a scan also
# lists devices iOS/macOS already hold (an Osmo gimbal bonds as a keyboard and stops advertising).
[patch.crates-io]
btleplug = { path = "vendor/btleplug-0.11.8" }
