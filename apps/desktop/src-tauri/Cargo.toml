[package]
name = "cavecad-desktop"
version = "0.0.1"
edition = "2024"
publish = false
description = "CaveCAD desktop app: the web app in a native window, with real folder paths and Reveal in Finder."

# Not part of the engine's workspace: the engine builds for the browser too, and this crate (a native
# window) must never be asked to.
[workspace]

[lib]
name = "cavecad_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
cave-folder = { path = "../../../crates/cave-folder" }

[target."cfg(any(target_os = \"macos\", windows, target_os = \"linux\"))".dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
