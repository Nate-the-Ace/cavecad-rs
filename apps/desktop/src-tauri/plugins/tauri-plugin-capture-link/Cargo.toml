[package]
name = "tauri-plugin-capture-link"
version = "0.0.1"
edition = "2024"
publish = false
links = "tauri-plugin-capture-link"
description = "CaveCAD on iPhone/iPad: shares stations with CaveCAD Capture through the keychain and links Capture's shots folder (Files bookmark). A no-op everywhere else."

[dependencies]
tauri = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
