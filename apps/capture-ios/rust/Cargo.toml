[workspace]

[package]
name = "capture-ffi"
edition = "2024"
version = "0.1.0"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
cave-capture = { path = "../../../crates/cave-capture" }
cave-survey = { path = "../../../crates/cave-survey" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# the gimbal (Osmo Mobile 7) over Bluetooth, driven from a tokio runtime on its own thread (src/gimbal.rs)
cave-osmo = { path = "../../../tools/cave-osmo" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }

[dev-dependencies]
cave-fixture = { path = "../../../crates/cave-fixture" }
cave-doc = { path = "../../../crates/cave-doc" }

# cave-osmo's btleplug (patched: on iOS it also finds a gimbal the OS has already bonded and holds)
[patch.crates-io]
btleplug = { path = "../../desktop/src-tauri/vendor/btleplug-0.11.8" }
