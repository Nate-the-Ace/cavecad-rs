name: CaveCADCapture
options:
  bundleIdPrefix: app.cavecad
  deploymentTarget: { iOS: "18.0" }
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 2ANLK72UUS
    CODE_SIGN_STYLE: Automatic
targets:
  CaveCADCapture:
    type: application
    platform: iOS
    sources:
      - Sources
      # AprilTag (BSD-2): the station cards' detector, tag16h5 only
      - path: Vendor/apriltag
        excludes: ["LICENSE.md", "VENDORED.txt", "**/*.h"]
        compilerFlags: ["-w", "-O2"]
      # The app icon (XcodeGen has no `resources:` key: it was silently ignored, so the icon never reached the app)
      - path: Resources/Assets.xcassets
        buildPhase: resources
    # Keychain groups: the app's own FIRST (the default group for any unscoped write, so the token never lands in
    # the shared one), then the group CaveCAD on this phone shares its stations in (SharedStations.swift).
    entitlements:
      path: Resources/CaveCADCapture.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)app.cavecad.capture
          - $(AppIdentifierPrefix)app.cavecad.shared
    dependencies:
      - framework: CaptureCore.xcframework
        embed: false
      # the core's Bluetooth (btleplug, for the gimbal) calls CoreBluetooth; a static library does not bring it
      - sdk: CoreBluetooth.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.cavecad.capture
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: CaveCAD Capture
        INFOPLIST_FILE: Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"  # iPhone + iPad (iPads without LiDAR are viewers)
        SWIFT_OBJC_BRIDGING_HEADER: Sources/CaveCADCapture-Bridging-Header.h
        HEADER_SEARCH_PATHS: "$(SRCROOT)/Vendor/apriltag"
        # Info.plist goes through the C preprocessor so the test URL scheme is registered in Debug only;
        # -C keeps "//" (the server URL) from being read as a comment
        INFOPLIST_PREPROCESS: "YES"
        INFOPLIST_OTHER_PREPROCESSOR_FLAGS: "-C"
      configs:
        Debug:
          INFOPLIST_PREPROCESSOR_DEFINITIONS: "CAPTURE_TEST_URLS=1"
  CaveCADCaptureTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies: [{ target: CaveCADCapture }]
    settings:
      base:
        # The app's product name has a space, so XcodeGen's default (target name) misses the binary.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/CaveCAD Capture.app/CaveCAD Capture"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  CaveCADCapture:
    build: { targets: { CaveCADCapture: all, CaveCADCaptureTests: [test] } }
    test: { targets: [CaveCADCaptureTests] }
