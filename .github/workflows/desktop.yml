# Builds the CaveCAD desktop app for macOS (one universal build: Apple silicon and Intel), Windows and
# Linux, and attaches the installers to a DRAFT release called "desktop-latest" (nothing is public
# until the draft is published from the Releases page).
#
# Run it by hand: Actions > desktop > Run workflow, or `gh workflow run desktop.yml`.
# The apps are not code-signed yet: macOS and Windows will warn the first time one is opened.
name: desktop

on:
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            targets: aarch64-apple-darwin,x86_64-apple-darwin,wasm32-unknown-unknown
          - platform: ubuntu-22.04
            args: ''
            targets: wasm32-unknown-unknown
          - platform: windows-latest
            args: ''
            targets: wasm32-unknown-unknown
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target

      - name: Install wasm-pack (the web app's engine is built with it)
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Linux libraries the window needs
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install the web app and the desktop shell
        run: |
          npm ci --prefix apps/web
          npm ci --prefix apps/desktop

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_RELAY_URL: ${{ secrets.RELAY_URL }}
        with:
          projectPath: apps/desktop
          tagName: desktop-latest
          releaseName: CaveCAD desktop (latest build)
          releaseBody: Unsigned builds of the CaveCAD desktop app. macOS and Windows warn the first time you open one. Built from the commit this release's tag points at on main.
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}
