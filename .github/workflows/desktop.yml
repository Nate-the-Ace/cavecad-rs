# Builds the CaveCAD desktop app for macOS (one universal build: Apple silicon and Intel), Windows and
# Linux, and attaches the installers to a DRAFT release called "desktop-latest" (nothing is public
# until the draft is published from the Releases page).
#
# Run it by hand: Actions > desktop > Run workflow, or `gh workflow run desktop.yml`.
# Test builds for admins (the "dev" update channel): `gh workflow run desktop.yml --ref <branch> -f channel=dev`
# puts them on the draft release "desktop-dev" instead; then `deploy/update-downloads.sh --dev` offers them to
# admins only. Both channels share the run number, so versions never go backwards across them.
# The apps are not code-signed yet: macOS and Windows will warn the first time one is opened.
# Each build is versioned 0.1.<run number> and its updates are signed with the CaveCAD update key (secrets
# TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD; spec 2026-11-09-desktop-self-update-design).
name: desktop

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'stable = everyone; dev = test build for admins only'
        type: choice
        options: [stable, dev]
        default: stable

env:
  RELEASE_TAG: ${{ inputs.channel == 'dev' && 'desktop-dev' || 'desktop-latest' }}

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            targets: aarch64-apple-darwin,x86_64-apple-darwin,wasm32-unknown-unknown
          - platform: ubuntu-22.04
            args: ''
            targets: wasm32-unknown-unknown
          - platform: windows-latest
            args: ''
            targets: wasm32-unknown-unknown
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target

      - name: Install wasm-pack (the web app's engine is built with it)
        run: npm install -g wasm-pack

      - name: Linux libraries the window needs
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install the web app and the desktop shell
        run: |
          npm ci --prefix apps/web
          npm ci --prefix apps/desktop

      - name: Version this build 0.1.<run number>, so an installed app knows it is newer
        shell: bash
        run: |
          node -e "const fs=require('fs'),f='apps/desktop/src-tauri/tauri.conf.json',c=JSON.parse(fs.readFileSync(f,'utf8'));c.version='0.1.${{ github.run_number }}';fs.writeFileSync(f,JSON.stringify(c,null,2))"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # signs each update file (the app refuses any update not signed with this key; its public half is in
          # tauri.conf.json). latest.json is NOT written here: the three builds finish at different times and
          # each would replace the others' entries; the `updates` job below writes it once, for every platform.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_FEEDBACK_ENDPOINT: ${{ secrets.FEEDBACK_ENDPOINT }}
          VITE_FEEDBACK_KEY: ${{ secrets.FEEDBACK_KEY }}
          # accounts: the offline pass's public key, CaveCAD's sign-in page, and the API host the desktop app calls
          VITE_PASS_PUBLIC_KEY: ${{ vars.PASS_PUBLIC_KEY }}
          VITE_SIGNIN_URL: ${{ vars.SIGNIN_URL }}
          VITE_ACCOUNT_BASE: ${{ vars.ACCOUNT_BASE }}
          # a test build says so in Account
          VITE_UPDATE_CHANNEL: ${{ inputs.channel }}
        with:
          projectPath: apps/desktop
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: ${{ inputs.channel == 'dev' && 'CaveCAD desktop (test build, admins)' || 'CaveCAD desktop (latest build)' }}
          releaseBody: Unsigned builds of the CaveCAD desktop app. macOS and Windows warn the first time you open one. Built from the commit this release's tag points at.
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}
          uploadUpdaterJson: false

  # The update list (latest.json) for every platform, once all three builds are on the release.
  updates:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Write latest.json from the release's signatures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: 0.1.${{ github.run_number }}
        run: |
          mkdir sigs && cd sigs
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            -p 'CaveCAD_universal.app.tar.gz.sig' \
            -p "CaveCAD_${VERSION}_amd64.AppImage.sig" -p "CaveCAD_${VERSION}_amd64.deb.sig" -p "CaveCAD-${VERSION}-1.x86_64.rpm.sig" \
            -p "CaveCAD_${VERSION}_x64-setup.exe.sig" -p "CaveCAD_${VERSION}_x64_en-US.msi.sig"
          python3 ../deploy/make-latest-json.py "$VERSION" \
            "Unsigned builds of the CaveCAD desktop app. macOS and Windows warn the first time you open one. Built from the commit this release's tag points at." \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG" > latest.json
          python3 -c "import json; p=json.load(open('latest.json'))['platforms']; assert len(p) == 11, p; print(sorted(p))"
          gh release upload "$RELEASE_TAG" latest.json --clobber --repo "$GITHUB_REPOSITORY"
