[package]
name = "cave-wasm"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
cave-log = { path = "../cave-log" }
cave-doc = { path = "../cave-doc" }
cave-fixture = { path = "../cave-fixture" }
cave-scene = { path = "../cave-scene" }
cave-style = { path = "../cave-style" }
cave-dxf = { path = "../cave-dxf" }
cave-draw = { path = "../cave-draw" }
cave-shape = { path = "../cave-shape" }
cave-id = { path = "../cave-id" }
cave-geom = { path = "../cave-geom" }
js-sys = "0.3"
tracing.workspace = true
tracing-subscriber.workspace = true
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
